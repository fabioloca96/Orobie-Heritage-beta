title: Orobie Heritage
description: "Escursioni guidate e storie di natura sulle Alpi Orobie con un Accompagnatore di Media Montagna certificato."
url: "https://www.orobie-heritage.com"
lang: it
logo: /images/logo1.png
image: /images/hero.jpg

# senza questo, Jekyll nasconde di default gli eventi con data futura
# (è pensato per i post di blog programmati, ma qui gli eventi futuri
# sono il contenuto principale del calendario)
future: true

plugins:
  - jekyll-sitemap

contact:
  whatsapp_number: "393792279354" # <-- sostituisci con il numero vero (formato internazionale, senza + né spazi)
  email: "orobie.heritage@gmail.com"

social:
  facebook: "https://www.facebook.com/profile.php?id=61593553893068"
  instagram: "https://www.instagram.com/orobie.heritage/"

newsletter:
  formspree_id: "xaewpboo"

collections:
  eventi:
    output: true
    permalink: /eventi/:path.html
  esperienze:
    output: false

defaults:
  - scope:
      path: ""
      type: "eventi"
    values:
      layout: "evento"

exclude:
  - "ALL.1 richiesta autorizzazione libera professione.doc"
  - "images/COMUNICAZIONE_N.636_-_Formazione_obbligatoria_sullintelligenza_artificiale__Scadenza_2_agosto_2026.pdf"
