backend:
  name: github
  repo: fabioloca96/Orobie-Heritage-beta
  branch: master
  base_url: https://orobie-cms-oauth.fabio-locatelli-1bl.workers.dev

site_url: https://www.orobie-heritage.com
display_url: https://www.orobie-heritage.com
publish_mode: simple

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "eventi"
    label: "Eventi"
    label_singular: "Evento"
    folder: "_eventi"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - {label: "Categoria", name: "category", widget: "select", options: [{label: "In Vetta", value: "in-vetta"}, {label: "Naturalistiche", value: "naturalistiche"}, {label: "Micologiche", value: "micologiche"}, {label: "E-Bike", value: "e-bike"}]}
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Title (EN)", name: "title_en", widget: "string", required: false}
      - {label: "Foto (massimo 2)", name: "images", widget: "list", required: false, max: 2, field: {label: "Foto", name: "image", widget: "image"}}
      - {label: "Descrizione breve", name: "desc", widget: "text", required: false}
      - {label: "Description (EN)", name: "desc_en", widget: "text", required: false}
      - {label: "Tag (separati da virgola)", name: "tag_list", widget: "string", required: false, hint: "es. Media difficoltà, 6h, Presolana"}
      - {label: "Tags (EN, comma separated)", name: "tag_list_en", widget: "string", required: false, hint: "e.g. Medium difficulty, 6h, Presolana"}
      - {label: "Luogo", name: "location", widget: "string", required: false, hint: "Nome del posto/ritrovo, es. \"Rifugio Curò, Val Seriana\". Viene usato anche per generare l'anteprima della mappa."}
      - {label: "Link Google Maps (opzionale)", name: "location_map_url", widget: "string", required: false, hint: "Su Google Maps: cerca il posto → Condividi → Copia link, e incollalo qui. Se lo lasci vuoto, il pulsante userà comunque il nome del luogo per aprire Google Maps."}
      - {label: "Costo", name: "cost", widget: "string", required: false, hint: "es. \"Gratuita\", \"20€ a persona\""}
      - {label: "Difficoltà", name: "difficulty", widget: "select", required: false, options: ["Facile", "Media", "Impegnativa"]}
      - {label: "Numero massimo partecipanti", name: "max_participants", widget: "string", required: false, hint: "es. \"15\""}
      - {label: "Cosa portare", name: "what_to_bring", widget: "text", required: false, hint: "Una voce per riga, es. scarponi da trekking / acqua / giacca a vento"}
      - {label: "Cosa portare (EN)", name: "what_to_bring_en", widget: "text", required: false}
      - {label: "Link modulo di iscrizione (opzionale)", name: "signup_url", widget: "string", required: false, hint: "Es. link a un Google Form. Se lo lasci vuoto, la sezione Iscrizione userà WhatsApp."}

  - name: "esperienze"
    label: "Esperienze (catalogo)"
    label_singular: "Esperienza"
    folder: "_esperienze"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - {label: "Titolo", name: "title", widget: "string"}
      - {label: "Title (EN)", name: "title_en", widget: "string", required: false}
      - {label: "Frase breve (per la card)", name: "excerpt", widget: "string", required: false}
      - {label: "Short phrase (EN, for the card)", name: "excerpt_en", widget: "string", required: false}
      - {label: "Foto di copertina", name: "cover", widget: "image", required: false}
      - {label: "Galleria foto (massimo 4)", name: "gallery", widget: "list", required: false, max: 4, field: {label: "Foto", name: "image", widget: "image"}}
      - {label: "Prezzo", name: "price", widget: "string", required: false, hint: "es. 35€ a persona, oppure \"su richiesta\""}
      - {label: "Durata", name: "duration", widget: "string", required: false, hint: "es. Mezza giornata, 6 ore"}
      - {label: "Difficoltà", name: "difficulty", widget: "select", required: false, options: ["Facile", "Media", "Impegnativa"]}
      - {label: "Descrizione completa", name: "body", widget: "markdown", required: false}
      - {label: "Full description (EN)", name: "body_en", widget: "markdown", required: false}
